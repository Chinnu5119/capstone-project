<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1004 510" width="1004" height="510" font-family="Helvetica, Arial, sans-serif"><title>System architecture</title><rect width="1004" height="510" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#98a2b3"/></marker></defs><text x="20" y="38" font-size="11" font-weight="600" fill="#667085" text-anchor="start">COLLECT</text><text x="226" y="38" font-size="11" font-weight="600" fill="#667085" text-anchor="start">NORMALISE AND LOAD</text><text x="432" y="38" font-size="11" font-weight="600" fill="#667085" text-anchor="start">STORE</text><text x="618" y="38" font-size="11" font-weight="600" fill="#667085" text-anchor="start">ANALYSE AND SERVE</text><text x="834" y="38" font-size="11" font-weight="600" fill="#667085" text-anchor="start">SHOW AND ALERT</text><rect x="20" y="60" width="150" height="270" rx="8" fill="#f2f4f7" stroke="#98a2b3" stroke-width="1.25"/><text x="95" y="80" font-size="13" font-weight="600" fill="#101828" text-anchor="middle">Cloud providers</text><rect x="32" y="94" width="126" height="50" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.25"/><text x="95" y="114" font-size="12.5" font-weight="600" fill="#101828" text-anchor="middle">AWS</text><text x="95" y="131" font-size="11" font-weight="400" fill="#667085" text-anchor="middle">Cost Explorer, EC2</text><rect x="32" y="152" width="126" height="50" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.25"/><text x="95" y="172" font-size="12.5" font-weight="600" fill="#101828" text-anchor="middle">Azure</text><text x="95" y="189" font-size="11" font-weight="400" fill="#667085" text-anchor="middle">Cost Mgmt, VMs</text><rect x="32" y="210" width="126" height="50" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.25"/><text x="95" y="230" font-size="12.5" font-weight="600" fill="#101828" text-anchor="middle">GCP</text><text x="95" y="247" font-size="11" font-weight="400" fill="#667085" text-anchor="middle">BigQuery export</text><rect x="32" y="268" width="126" height="50" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.25"/><text x="95" y="288" font-size="12.5" font-weight="600" fill="#101828" text-anchor="middle">Demo data</text><text x="95" y="305" font-size="11" font-weight="400" fill="#667085" text-anchor="middle">mock, no keys</text><rect x="226" y="60" width="150" height="70" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.25"/><text x="301" y="82" font-size="13" font-weight="600" fill="#101828" text-anchor="middle">Collectors</text><text x="301" y="100" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">one per cloud</text><text x="301" y="116" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">same interface</text><rect x="226" y="160" width="150" height="70" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.25"/><text x="301" y="182" font-size="13" font-weight="600" fill="#101828" text-anchor="middle">Normalise</text><text x="301" y="200" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">shared environment</text><text x="301" y="216" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">and type labels</text><rect x="226" y="260" width="150" height="70" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.25"/><text x="301" y="282" font-size="13" font-weight="600" fill="#101828" text-anchor="middle">Ingestion</text><text x="301" y="300" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">idempotent writes</text><text x="301" y="316" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">every 15 min / 6 h</text><rect x="432" y="60" width="130" height="310" rx="8" fill="#eef1fe" stroke="#4f6bed" stroke-width="2"/><text x="497" y="86" font-size="13" font-weight="600" fill="#101828" text-anchor="middle">PostgreSQL</text><text x="497" y="130" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">costs</text><text x="497" y="154" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">resources</text><text x="497" y="178" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">utilisation</text><text x="497" y="202" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">alert rules</text><text x="497" y="226" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">alert history</text><rect x="618" y="60" width="160" height="180" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.25"/><text x="698" y="82" font-size="13" font-weight="600" fill="#101828" text-anchor="middle">Backend services</text><text x="698" y="108" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">analytics and trends</text><text x="698" y="130" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">cost optimiser</text><text x="698" y="152" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">alert rule engine</text><text x="698" y="174" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">REST API + /metrics</text><rect x="618" y="300" width="160" height="70" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.25"/><text x="698" y="322" font-size="13" font-weight="600" fill="#101828" text-anchor="middle">Alert webhook</text><text x="698" y="340" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">records history</text><text x="698" y="356" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">sends notifications</text><rect x="834" y="60" width="150" height="70" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.25"/><text x="909" y="82" font-size="13" font-weight="600" fill="#101828" text-anchor="middle">React dashboard</text><text x="909" y="100" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">6 pages</text><text x="909" y="116" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">nginx :8080</text><rect x="834" y="180" width="150" height="70" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.25"/><text x="909" y="202" font-size="13" font-weight="600" fill="#101828" text-anchor="middle">Prometheus</text><text x="909" y="220" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">scrapes /metrics</text><text x="909" y="236" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">fires after 2 min</text><rect x="834" y="300" width="150" height="70" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.25"/><text x="909" y="322" font-size="13" font-weight="600" fill="#101828" text-anchor="middle">Alertmanager</text><text x="909" y="340" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">groups, de-duplicates</text><text x="909" y="356" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">repeats every 4 h</text><rect x="618" y="430" width="160" height="60" rx="8" fill="#fff" stroke="#98a2b3" stroke-width="1.25"/><text x="698" y="452" font-size="13" font-weight="600" fill="#101828" text-anchor="middle">Slack / Teams</text><text x="698" y="470" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle">firing and resolved</text><path d="M170 95L226 95" stroke="#98a2b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M301 130L301 160" stroke="#98a2b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M301 230L301 260" stroke="#98a2b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M376 295L432 295" stroke="#98a2b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M562 150L618 150" stroke="#98a2b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M778 95L834 95" stroke="#98a2b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="806" y="87" font-size="10.5" font-weight="400" fill="#667085" text-anchor="middle">REST /api</text><path d="M778 215L834 215" stroke="#98a2b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="806" y="207" font-size="10.5" font-weight="400" fill="#667085" text-anchor="middle">/metrics</text><path d="M909 250L909 300" stroke="#98a2b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M834 335L778 335" stroke="#98a2b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="806" y="327" font-size="10.5" font-weight="400" fill="#667085" text-anchor="middle">webhook</text><path d="M618 335L562 335" stroke="#98a2b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M698 370L698 430" stroke="#98a2b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="20" y="438" font-size="12" font-weight="400" fill="#667085" text-anchor="start">Every cloud is normalised before it is stored, so charts, the optimiser and</text><text x="20" y="456" font-size="12" font-weight="400" fill="#667085" text-anchor="start">alert rules behave the same for AWS, Azure and GCP.</text><rect x="20" y="474" width="14" height="14" rx="8" fill="#eef1fe" stroke="#4f6bed" stroke-width="2"/><text x="42" y="486" font-size="11" font-weight="400" fill="#667085" text-anchor="start">data store</text></svg>