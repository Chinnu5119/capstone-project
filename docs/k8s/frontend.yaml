# nginx serves the React build and proxies /api/ to the Service named "backend" (see frontend/nginx.conf),
# so the browser only ever talks to one origin and no CORS or backend public URL is needed.
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: devops-dashboard }
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: devops-dashboard }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: ${ECR_REGISTRY}/devops-dashboard/frontend:${IMAGE_TAG}
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
