apiVersion: v1
kind: Service
metadata: { name: alertmanager, namespace: devops-dashboard }
spec:
  selector: { app: alertmanager }
  ports: [{ port: 9093 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: alertmanager, namespace: devops-dashboard }
spec:
  replicas: 1
  selector: { matchLabels: { app: alertmanager } }
  template:
    metadata: { labels: { app: alertmanager } }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
          ports: [{ containerPort: 9093 }]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }     # created by Jenkins from deploy/alertmanager/*
        - name: data
          emptyDir: {}
